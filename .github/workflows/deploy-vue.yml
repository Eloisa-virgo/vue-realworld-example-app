name: deploy vue
on:
  push:
    branches:
      - master
      - prod

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # 1. 适配你的项目：用 npm 替代 pnpm，使用稳定的 Node 16（和项目完美兼容）
      - name: Use Node.js 16.x
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'npm'

      # 2. 安装依赖 + 构建（跳过 node-sass 编译脚本，解决 Python 报错）
      - name: Install dependencies and build
        run: |
          npm install --ignore-scripts
          npm run build

      # 3. 上传构建产物到服务器（和你原来的配置一致）
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "./dist/*"
          target: "/var/www/html"
          strip_components: 1
